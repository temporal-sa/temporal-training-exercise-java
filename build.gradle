plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.temporal:temporal-sdk:1.38.0'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    
    testImplementation 'io.temporal:temporal-testing:1.38.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.temporal.training.WorkerMain'
}

tasks.register('execute', JavaExec) {
    // providers.gradleProperty gives a Provider<String>; project.property returns
    // Object, which makes .split(" ") resolve to Groovy's DefaultGroovyMethods
    // split(Closure) instead of String.split(String).
    mainClass = providers.gradleProperty('mainClass').orElse('')
    classpath = sourceSets.main.runtimeClasspath
    def execArgs = providers.gradleProperty('args')
    if (execArgs.present) {
        args execArgs.get().split(' ')
    }
}
