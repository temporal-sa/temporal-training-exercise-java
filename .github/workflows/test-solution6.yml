name: Test Solution 6

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # No gradle-version here on purpose: the wrapper in
    # gradle/wrapper/gradle-wrapper.properties is the single source of truth,
    # so a version bump is one file, not two. The action still handles
    # dependency caching and wrapper-jar validation.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    
    - name: Run Solution 6 Tests
      run: ./gradlew test --tests "com.temporal.training.solution6.MoneyTransferWorkflowTest"
