slug: temporal-in-practice-java
title: Temporal in Practice - Java
teaser: Seven hands-on Java exercises. Write the Workflows, Activities, Signals, Queries
  and tests yourself.
description: |-
  A hands-on Temporal workshop in Java. Every challenge hands you a package
  full of TODOs and a Temporal dev server that is already running.

  Start with a Workflow that returns a greeting. Finish with a money
  transfer Workflow that takes a Signal for approval, answers Queries about
  its state, carries a search attribute, labels its own event history, and
  parks on a bad account number until a Signal brings it the corrected data.

  The Solution tab has the finished code for every exercise. Use it when
  you get stuck, not before.
